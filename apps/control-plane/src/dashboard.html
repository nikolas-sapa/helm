<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helm — internal agents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Black & white system: DM Sans (smooth/rounded) + Geist Mono for figures. */
      :root {
        --bg: #000000;
        --surface: #0a0a0a;
        --surface-2: #111111;
        --border: #1f1f1f;
        --border-strong: #2e2e2e;
        --text: #ededed;
        --muted: #a1a1a1;
        --faint: #707070;
        /* monochrome: status uses grayscale weight, not color */
        --ok: #ededed;
        --warn: #a1a1a1;
        --bad: #ededed;
        --r: 8px;
        --r-sm: 6px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-variant-numeric: tabular-nums;
      }
      h1, h2, h3 { margin: 0; letter-spacing: -0.02em; font-weight: 600; }
      code, .mono { font-family: "Geist Mono", monospace; }
      a { color: inherit; }

      header {
        display: flex; align-items: center; gap: 10px;
        padding: 0 24px; height: 56px;
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; background: rgba(0,0,0,.7);
        backdrop-filter: saturate(180%) blur(8px); z-index: 10;
      }
      .logo { color: var(--text); display: flex; }
      header h1 { font-size: 15px; font-weight: 600; }
      header .slash { color: var(--border-strong); font-size: 18px; font-weight: 300; }
      header .tag { color: var(--muted); font-size: 13px; }

      main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 64px; }
      .layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
      @media (min-width: 900px) { .layout { grid-template-columns: 320px 1fr; align-items: start; } }

      .panel {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--r); overflow: hidden;
      }
      .panel > h2 { font-size: 11px; font-weight: 500; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.08em; padding: 14px 16px;
        border-bottom: 1px solid var(--border); }

      .agent {
        display: flex; flex-direction: column; gap: 5px; padding: 13px 16px;
        border-bottom: 1px solid var(--border); cursor: pointer;
        transition: background .12s ease;
      }
      .agent:last-child { border-bottom: none; }
      .agent:hover { background: var(--surface-2); }
      .agent.active { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--text); }
      .agent .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
      .agent .name { font-weight: 500; font-size: 14px; letter-spacing: -0.01em; }
      .agent .spend { font-family: "Geist Mono", monospace; font-size: 12.5px; color: var(--text); }
      .agent .sub { color: var(--faint); font-size: 12px; font-family: "Geist Mono", monospace; }
      .empty { padding: 22px 16px; color: var(--muted); font-size: 13px; }

      .detail-head { padding: 22px 22px 18px; border-bottom: 1px solid var(--border); }
      .detail-head h2 { font-size: 19px; letter-spacing: -0.02em; }
      .meta { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px;
        color: var(--muted); font-size: 12.5px; }
      .meta b { color: var(--text); font-weight: 500; font-family: "Geist Mono", monospace; }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
        background: var(--border); border-bottom: 1px solid var(--border); }
      .stat { background: var(--surface); padding: 16px 18px; }
      .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .stat .v { font-family: "Geist Mono"; font-size: 19px; margin-top: 6px; letter-spacing: -0.02em; }

      .section { padding: 20px 22px; }
      .section h3 { font-size: 11px; color: var(--muted); text-transform: uppercase;
        letter-spacing: 0.08em; margin-bottom: 14px; font-weight: 500; }

      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; color: var(--faint); font-weight: 500; padding: 0 10px 10px;
        border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
      td { padding: 11px 10px; border-bottom: 1px solid var(--border); font-family: "Geist Mono"; font-size: 12.5px; color: var(--muted); }
      tr:last-child td { border-bottom: none; }
      td:first-child, th:first-child { padding-left: 0; }

      .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
        border-radius: 999px; font-size: 11px; font-family: "DM Sans", sans-serif; font-weight: 500;
        border: 1px solid var(--border-strong); color: var(--muted); }
      .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
      .badge.ok { color: var(--ok); } .badge.ok::before { background: var(--ok); }
      .badge.failed { color: var(--bad); } .badge.failed::before { background: var(--bad); }
      .badge.blocked, .badge.budget_exceeded { color: var(--warn); }
      .badge.blocked::before, .badge.budget_exceeded::before { background: var(--warn); }

      form .field { margin-bottom: 14px; }
      label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 7px; }
      input {
        width: 100%; background: var(--bg); border: 1px solid var(--border-strong);
        color: var(--text); border-radius: var(--r-sm); padding: 9px 11px;
        font-family: "Geist Mono"; font-size: 13px; transition: border-color .12s ease;
      }
      input:focus { outline: none; border-color: var(--text); }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      button {
        background: var(--text); color: #000; border: 1px solid var(--text); border-radius: var(--r-sm);
        padding: 9px 15px; font-family: "DM Sans", sans-serif; font-weight: 500;
        font-size: 13px; cursor: pointer; transition: opacity .12s ease;
      }
      button:hover { opacity: 0.82; }

      .placeholder { display: flex; align-items: center; justify-content: center;
        min-height: 300px; color: var(--faint); font-size: 13px; }
      .saved { color: var(--ok); font-size: 13px; margin-left: 12px; }

      .login { position: fixed; inset: 0; background: var(--bg); display: none;
        align-items: center; justify-content: center; z-index: 100; padding: 24px; }
      .login.show { display: flex; }
      .login-card { width: 100%; max-width: 360px; display: flex; flex-direction: column;
        align-items: stretch; gap: 14px; }
      .login-card .logo { justify-content: center; margin-bottom: 2px; }
      .login-card h2 { text-align: center; font-size: 22px; letter-spacing: -0.02em; }
      .login-sub { text-align: center; color: var(--muted); font-size: 13px; margin: -6px 0 6px; }
      .login-card input { font-family: "Geist Mono"; text-align: center; }
      .login-card button { width: 100%; padding: 11px; }
      .login-err { color: var(--bad); font-size: 12.5px; text-align: center; min-height: 16px; }

      .panel-head { display: flex; align-items: center; justify-content: space-between;
        border-bottom: 1px solid var(--border); padding-right: 10px; }
      .panel-head > h2 { border-bottom: none; }
      .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border-strong);
        padding: 5px 11px; font-size: 12.5px; border-radius: var(--r-sm); }
      .btn-ghost:hover { background: var(--surface-2); opacity: 1; }

      .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6);
        backdrop-filter: blur(2px); display: none; align-items: flex-start;
        justify-content: center; padding: 8vh 20px; z-index: 50; }
      .overlay.open { display: flex; }
      .modal { width: 100%; max-width: 520px; background: var(--surface);
        border: 1px solid var(--border-strong); border-radius: var(--r);
        box-shadow: 0 16px 48px rgba(0,0,0,.5); overflow: hidden; }
      .modal-head { display: flex; align-items: center; justify-content: space-between;
        padding: 16px 18px; border-bottom: 1px solid var(--border); }
      .modal-head h3 { font-size: 15px; letter-spacing: -0.01em; }
      .modal-head .x { background: transparent; border: none; color: var(--muted);
        font-size: 18px; cursor: pointer; padding: 0 4px; }
      .modal-body { padding: 18px; }
      textarea { width: 100%; background: var(--bg); border: 1px solid var(--border-strong);
        color: var(--text); border-radius: var(--r-sm); padding: 10px 12px;
        font-family: "Geist Mono"; font-size: 12px; line-height: 1.5; min-height: 130px;
        resize: vertical; }
      textarea:focus { outline: none; border-color: var(--text); }
      .modal-foot { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
      .note { color: var(--faint); font-size: 12px; }
      .result { margin-top: 6px; border: 1px solid var(--border); border-radius: var(--r-sm);
        padding: 14px; background: var(--bg); }
      .result .k { color: var(--muted); font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.06em; margin-bottom: 4px; }
      .result .val { font-family: "Geist Mono"; font-size: 12px; word-break: break-all;
        color: var(--text); margin-bottom: 12px; }
      .result .warn { color: var(--warn); font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="login" id="login">
      <form class="login-card" id="login-form">
        <span class="logo" aria-hidden="true">
          <svg width="26" height="23" viewBox="0 0 76 65" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M37.527 0L75.054 65H0z" fill="currentColor" />
          </svg>
        </span>
        <h2>Helm</h2>
        <p class="login-sub">Enter your admin token to access the control plane.</p>
        <input name="token" type="password" placeholder="hadm_…" autocomplete="off" autofocus />
        <button type="submit">Continue</button>
        <div class="login-err" id="login-err"></div>
      </form>
    </div>

    <header>
      <span class="logo" aria-hidden="true">
        <svg width="20" height="18" viewBox="0 0 76 65" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M37.527 0L75.054 65H0z" fill="currentColor" />
        </svg>
      </span>
      <h1>Helm</h1>
      <span class="slash">/</span>
      <span class="tag">internal agents</span>
    </header>
    <main>
      <div class="layout">
        <div class="panel">
          <div class="panel-head">
            <h2>Agents</h2>
            <button class="btn-ghost" id="new-agent-btn" type="button">+ New</button>
          </div>
          <div id="agent-list"><div class="empty">Loading…</div></div>
        </div>
        <div class="panel" id="detail">
          <div class="placeholder">Select an agent to see runs, spend and policy.</div>
        </div>
      </div>
    </main>

    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-head">
          <h3>New agent</h3>
          <button class="x" id="modal-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <form id="new-agent-form">
            <div class="field"><label>Name</label>
              <input name="name" placeholder="My Agent" autocomplete="off" required /></div>
            <div class="field"><label>Model</label>
              <input name="model" value="gpt-5.4-mini" autocomplete="off" /></div>
            <div class="field"><label>agent.ts</label>
              <textarea name="code" spellcheck="false">import { defineAgent } from "@helm/agent";

export default defineAgent({
  async run(input, ctx) {
    return { echo: input };
  },
});</textarea></div>
            <div class="modal-foot">
              <button type="submit" id="deploy-btn">Deploy</button>
              <span class="note" id="deploy-note">Provisions a dedicated Convex DB — ~1 min.</span>
            </div>
          </form>
          <div id="deploy-result"></div>
        </div>
      </div>
    </div>

    <script>
      const fmtUsd = (n) => "$" + (n ?? 0).toFixed(4);
      const fmtTok = (n) => (n ?? 0).toLocaleString();
      // Escape for HTML text AND attribute contexts (encodes " and ' too).
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      let activeSlug = null;

      // --- admin token via login screen; sent as Bearer ---
      class Unauthorized extends Error {}
      const loginEl = document.getElementById("login");
      function showLogin(msg) {
        document.getElementById("login-err").textContent = msg || "";
        loginEl.classList.add("show");
        const i = loginEl.querySelector('input[name="token"]');
        i.value = "";
        i.focus();
      }
      function hideLogin() { loginEl.classList.remove("show"); }

      async function authedFetch(url, opts = {}) {
        const token = sessionStorage.getItem("helm_admin") || "";
        const headers = { ...(opts.headers || {}), authorization: "Bearer " + token };
        const res = await fetch(url, { ...opts, headers });
        if (res.status === 401) {
          sessionStorage.removeItem("helm_admin");
          showLogin("Invalid or expired token.");
          throw new Unauthorized("unauthorized");
        }
        return res;
      }

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const t = e.target.elements["token"].value.trim();
        if (!t) return;
        sessionStorage.setItem("helm_admin", t);
        hideLogin();
        loadAgents().catch((err) => { if (!(err instanceof Unauthorized)) console.error(err); });
      });

      async function loadAgents() {
        const { agents } = await (await authedFetch("/api/agents")).json();
        const el = document.getElementById("agent-list");
        if (!agents.length) {
          el.innerHTML = '<div class="empty">No agents yet. Deploy one with <code>helm deploy</code>.</div>';
          return;
        }
        el.innerHTML = agents
          .map(
            (a) => `
          <div class="agent ${a.slug === activeSlug ? "active" : ""}" data-slug="${esc(a.slug)}">
            <div class="row"><span class="name">${esc(a.name)}</span><span class="spend">${fmtUsd(a.stats.costUsd)}</span></div>
            <div class="row"><span class="sub">${esc(a.slug)} · ${esc(a.model ?? "default")}</span><span class="sub">${a.stats.runs} runs</span></div>
          </div>`,
          )
          .join("");
        el.querySelectorAll(".agent").forEach((n) =>
          n.addEventListener("click", () => loadDetail(n.dataset.slug)),
        );
      }

      async function loadDetail(slug) {
        activeSlug = slug;
        document.querySelectorAll(".agent").forEach((n) =>
          n.classList.toggle("active", n.dataset.slug === slug),
        );
        const d = await (await authedFetch("/api/agents/" + encodeURIComponent(slug))).json();
        const p = d.policy || { allowedTools: [], allowedDomains: [], perRunTokenCeiling: 0, monthlyTokenCap: 0 };
        // status drives a CSS class — whitelist it so it can never inject markup.
        const statusClass = (s) =>
          ["ok", "failed", "blocked", "budget_exceeded"].includes(s) ? s : "";
        const runRows = d.runs.length
          ? d.runs
              .map(
                (r) => `<tr>
              <td><span class="badge ${statusClass(r.status)}">${esc(r.status)}</span></td>
              <td>${fmtTok(r.tokensIn)}/${fmtTok(r.tokensOut)}</td>
              <td>${fmtUsd(r.costUsd)}</td>
              <td>${Number(r.durationMs)} ms</td>
              <td title="${esc(r.inputRedacted || "")}">${esc((r.inputRedacted || "").slice(0, 32))}</td>
            </tr>`,
              )
              .join("")
          : '<tr><td colspan="5" style="color:var(--muted)">No runs yet.</td></tr>';

        document.getElementById("detail").innerHTML = `
          <div class="detail-head">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
              <h2>${esc(d.agent.name)}</h2>
              <div style="display:flex;align-items:center;gap:10px">
                <span class="badge ${d.agent.status === "active" ? "ok" : "blocked"}">${esc(d.agent.status)}</span>
                <button class="btn-ghost" id="toggle-status" type="button">${d.agent.status === "active" ? "Disable" : "Enable"}</button>
              </div>
            </div>
            <div class="meta">
              <span>endpoint <b>/a/${esc(d.agent.slug)}/run</b></span>
              <span>model <b>${esc(d.agent.model ?? "default")}</b></span>
              <span>db <b>${esc(d.agent.convexUrl ? d.agent.convexUrl.replace("https://", "") : "—")}</b></span>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><div class="k">30-day spend</div><div class="v">${fmtUsd(d.stats.costUsd)}</div></div>
            <div class="stat"><div class="k">tokens (in/out)</div><div class="v">${fmtTok(d.stats.tokensIn)}/${fmtTok(d.stats.tokensOut)}</div></div>
            <div class="stat"><div class="k">runs</div><div class="v">${d.stats.runs}</div></div>
          </div>
          <div class="section">
            <h3>Recent runs</h3>
            <table>
              <thead><tr><th>status</th><th>tokens</th><th>cost</th><th>duration</th><th>input</th></tr></thead>
              <tbody>${runRows}</tbody>
            </table>
          </div>
          <div class="section" style="border-top:1px solid var(--border)">
            <h3>Policy — what IT allows</h3>
            <form id="policy-form">
              <div class="field"><label>Allowed tools (comma-separated)</label>
                <input name="allowedTools" value="${esc(p.allowedTools.join(", "))}" /></div>
              <div class="field"><label>Allowed domains (comma-separated)</label>
                <input name="allowedDomains" value="${esc(p.allowedDomains.join(", "))}" placeholder="api.github.com" /></div>
              <div class="grid2">
                <div class="field"><label>Per-run token ceiling</label>
                  <input name="perRunTokenCeiling" type="number" value="${Number(p.perRunTokenCeiling)}" /></div>
                <div class="field"><label>Monthly token cap</label>
                  <input name="monthlyTokenCap" type="number" value="${Number(p.monthlyTokenCap)}" /></div>
              </div>
              <button type="submit">Save policy</button>
              <span class="saved" id="saved" style="display:none">Saved</span>
            </form>
          </div>`;

        document.getElementById("toggle-status").addEventListener("click", async (e) => {
          const next = d.agent.status === "active" ? "disabled" : "active";
          e.target.disabled = true;
          e.target.textContent = "…";
          await authedFetch("/api/agents/" + encodeURIComponent(slug) + "/status", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ status: next }),
          });
          await loadDetail(slug);
          loadAgents();
        });

        document.getElementById("policy-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = e.target;
          const parseList = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
          await authedFetch("/api/agents/" + encodeURIComponent(slug) + "/policy", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              allowedTools: parseList(f.allowedTools.value),
              allowedDomains: parseList(f.allowedDomains.value),
              perRunTokenCeiling: Number(f.perRunTokenCeiling.value),
              monthlyTokenCap: Number(f.monthlyTokenCap.value),
            }),
          });
          const s = document.getElementById("saved");
          s.style.display = "inline";
          setTimeout(() => (s.style.display = "none"), 1500);
          loadAgents();
        });
      }

      // --- New agent modal ---
      const overlay = document.getElementById("overlay");
      function openModal() {
        document.getElementById("deploy-result").innerHTML = "";
        overlay.classList.add("open");
      }
      function closeModal() { overlay.classList.remove("open"); }
      document.getElementById("new-agent-btn").addEventListener("click", openModal);
      document.getElementById("modal-close").addEventListener("click", closeModal);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });

      document.getElementById("new-agent-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target;
        const els = f.elements;
        const name = els["name"].value.trim();
        if (!name) return;
        const btn = document.getElementById("deploy-btn");
        const note = document.getElementById("deploy-note");
        btn.disabled = true;
        btn.textContent = "Deploying…";
        note.textContent = "Provisioning database — this can take ~1 minute.";
        try {
          const res = await authedFetch("/api/deploy", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              name,
              model: els["model"].value.trim() || undefined,
              files: [{ path: "agent.ts", content: els["code"].value }],
            }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.detail || body.error || ("HTTP " + res.status));
          document.getElementById("deploy-result").innerHTML = `
            <div class="result">
              <div class="k">Endpoint</div>
              <div class="val">${esc(body.agentUrl)}</div>
              <div class="k">API key — shown once, copy it now</div>
              <div class="val">${esc(body.key)}</div>
              <div class="k">Database</div>
              <div class="val">${esc(body.convexUrl || "—")}</div>
              <div class="warn">The key is not stored in plaintext and won't be shown again.</div>
            </div>`;
          f.reset();
          els["model"].value = "gpt-5.4-mini";
          loadAgents();
        } catch (err) {
          document.getElementById("deploy-result").innerHTML =
            `<div class="result"><div class="warn">Deploy failed: ${esc(err.message)}</div></div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = "Deploy";
          note.textContent = "Provisions a dedicated Convex DB — ~1 min.";
        }
      });

      if (sessionStorage.getItem("helm_admin")) {
        loadAgents().catch((err) => { if (!(err instanceof Unauthorized)) console.error(err); });
      } else {
        showLogin();
      }
    </script>
  </body>
</html>
